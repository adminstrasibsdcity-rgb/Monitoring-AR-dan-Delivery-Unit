<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNIT HUB – Integrated Unit Delivery & Receivable Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#f2f5fa;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--head:#0b1b3b;--head-ink:#ffffff;
  --brand:#1d4ed8;--brand-soft:#dbeafe;--red:#dc2626;--red-soft:#fee2e2;--amber:#b45309;--amber-soft:#fef3c7;
  --green:#15803d;--green-soft:#dcfce7;--gray-soft:#e8edf4;--input:#ffffff;--row-hover:#f8fafc;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1020;--card:#111a2e;--ink:#e6ebf5;--mute:#93a1ba;--line:#22304b;--head:#070d1b;--head-ink:#ffffff;
    --brand:#60a5fa;--brand-soft:#16294d;--red:#f87171;--red-soft:#3a1717;--amber:#fbbf24;--amber-soft:#3a2d0c;
    --green:#4ade80;--green-soft:#0f2e1b;--gray-soft:#1a2640;--input:#0d1526;--row-hover:#15213a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1020;--card:#111a2e;--ink:#e6ebf5;--mute:#93a1ba;--line:#22304b;--head:#070d1b;--head-ink:#ffffff;
  --brand:#60a5fa;--brand-soft:#16294d;--red:#f87171;--red-soft:#3a1717;--amber:#fbbf24;--amber-soft:#3a2d0c;
  --green:#4ade80;--green-soft:#0f2e1b;--gray-soft:#1a2640;--input:#0d1526;--row-hover:#15213a;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:50}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--red)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-style:normal;font-size:16px}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;letter-spacing:0}
.today{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
nav#nav{width:100%;display:flex;gap:2px;overflow-x:auto;padding-top:6px;scrollbar-width:none}
nav#nav button{flex:none;background:none;border:0;color:#fff;opacity:.72;padding:9px 14px;font:600 13px system-ui,sans-serif;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
nav#nav button:hover{opacity:1}
nav#nav button.on{opacity:1;border-bottom-color:#fff}
nav#nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1400px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 10px}
.muted{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.kpi.red{border-left-color:var(--red)}.kpi.green{border-left-color:var(--green)}.kpi.amber{border-left-color:var(--amber)}.kpi.gray{border-left-color:var(--mute)}
.kpi .l{font-size:12px;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mute)}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .sp{flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 250px);min-height:120px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--gray-soft);text-align:left;padding:8px 10px;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--row-hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:11px;color:var(--mute)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.lnk{color:var(--brand);cursor:pointer;text-decoration:none}.lnk:hover{text-decoration:underline}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--gray-soft);color:var(--ink)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.info{background:var(--brand-soft);color:var(--brand)}
td select,td input[type=date],td input[type=text]{padding:4px 6px;font-size:12px;max-width:160px}
.hbar{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.hbar .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:14px;background:var(--gray-soft);border-radius:7px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--brand);border-radius:7px}
.hbar.r .b i{background:var(--red)}.hbar.a .b i{background:#d97706}.hbar.g .b i{background:var(--green)}
.hbar .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.todo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.todo:hover{border-color:var(--brand)}
.todo b.n{min-width:30px;text-align:center;border-radius:8px;padding:2px 8px;background:var(--red-soft);color:var(--red)}
.todo.zero b.n{background:var(--green-soft);color:var(--green)}
.banner{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:8px}
.strip b{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,10,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px;overflow:auto}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:14px;width:min(880px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--line)}
.sheet-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sheet-b{padding:14px 18px;max-height:calc(100vh - 220px);overflow:auto}
.sheet-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card);border-radius:0 0 14px 14px}
.sec{margin:0 0 16px}
.sec>h4{margin:0 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600}
.fld input,.fld select,.fld textarea{font-weight:400;color:var(--ink);width:100%}
.fld small{font-weight:400;font-size:11px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;padding-top:18px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;background:var(--gray-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px}
.info-grid span{display:block;color:var(--mute);font-size:11px}
.info-grid b{font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f172a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw}
.slot{display:grid;grid-template-columns:90px 1fr;gap:0}
.empty{padding:28px;text-align:center;color:var(--mute)}
textarea.paste{width:100%;min-height:110px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
@media (max-width:640px){main{padding:10px}.kpi .v{font-size:19px}.tw{max-height:none}}

.rolebtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.rolebtn:hover{background:rgba(255,255,255,.22)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.pill b{margin-left:6px;opacity:.75}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.next{background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
.lock{opacity:.6}
.tag{font-size:10px;padding:1px 7px;border-radius:6px;background:var(--gray-soft);color:var(--mute);margin-left:6px;font-weight:700;letter-spacing:0;text-transform:none}
tr.clk{cursor:pointer}
details.card summary{cursor:pointer;font-weight:700}
.btn.ok{background:var(--green);color:#fff}
.btn.warn{background:#d97706;color:#fff}
.kb{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.kc .rsd{padding:4px 6px;font-size:12px}
.slotb{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 9px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:var(--card);color:var(--ink);font-family:inherit}
.slotb span{display:block;font-size:11px;color:var(--mute)}
.slotb.ok{cursor:pointer;border-color:var(--green)}
.slotb.ok span{color:var(--green)}
.slotb.sel{background:var(--green-soft);outline:2px solid var(--green)}
.slotb.off{opacity:.75}
.slotb.off span{color:var(--red)}
.kc{min-width:210px}
.zb{display:inline-block;margin:2px 4px 2px 0;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer;font-family:inherit;text-align:left}
.zb small{display:block;font-size:10.5px;color:var(--mute)}
.zb.sel{background:var(--brand-soft);border-color:var(--brand);outline:2px solid var(--brand)}
.zb.far{border-style:dashed}
.ln{min-height:28px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i>🚗</i><div>UNIT HUB<small>Integrated Unit Delivery &amp; Receivable Management</small></div></div>
    <div class="today" id="today"></div><button class="rolebtn" id="role" data-act="login"></button>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"></main>
<div class="modal" id="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= DATA CONTOH (dari file Monitoring_Unit_BSDC) ================= */
const SAMPLE = {ar:[],do:[],stock:[],man:{}};

/* ================= KONSTANTA ================= */
const SLOTS=['Slot 1','Slot 2','Slot 3','Slot 4','Cadangan','Serah Terima Cabang'];
const SC='Serah Terima Cabang';
const L_SYARAT=['Tanpa STNK','Tunggu STNK Jadi','Tunggu KIR Selesai'];
const L_BAYAR=['Full DP','Full Payment','Belum Full DP','Belum Full Payment'];
const L_QC=['OK','Not OK'];
const L_KONF=['On Scheduled','Rescheduled'];
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const LS_KEY='unittrack.bsdc.v2';
const MAN_KEYS=['fullDP','tglValid','planLunas','tglDR','planSampai','tglQC','decIn','decOut','cuci','hasilQC','ketDefect','syarat','tglMohonSTNK','tglSTNKJadi','tglPlan','slot','jarak','jamSerah','alamat','konfirmasi','reschedule','rsSlot','bstkCetak','bstkKembali','ketDelivery'];
const DEF_SET=()=>({jamBuka:'08:00',jamTutup:'17:00',maxSlot:4,durZona0:1,
  zones:[{n:'Zona 1',min:0,max:14,dur:2},{n:'Zona 2',min:15,max:22,dur:3},{n:'Zona 3',min:23,max:30,dur:4},{n:'Zona 4',min:31,max:38,dur:5},{n:'Zona 5',min:39,max:46,dur:6}],
  leasingDP:['PT. TAFS','ACC'],branchLoc:['T066','T050'],pins:defPins()});

/* ================= UTIL ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const rpS=n=>{n=n||0;const a=Math.abs(n);if(a>=1e9)return 'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M';if(a>=1e6)return 'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt';return rp(n)};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())};
const fmtD=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return (+d)+' '+BULAN[+m-1]+' '+String(y).slice(2)};
const dayName=iso=>{const [y,m,d]=iso.split('-').map(Number);return HARI[new Date(y,m-1,d).getDay()]};
const toH=s=>{if(!s)return '';const a=String(s).split(':');return (+a[0])+(+a[1]||0)/60};
const hh=h=>{if(h===''||h==null||isNaN(h))return '';const t=Math.round(h*60);return p2(Math.floor(t/60)%24)+':'+p2(t%60)};
const chipCls=t=>{t=String(t||'');
  if(/^(Sudah Delivery|Di Cabang|Lunas|Terjadwal|OK|Ya|STNK Jadi|Tidak Perlu)/.test(t))return 'ok';
  if(/^(Kirim Tagihan|Hold AR|Hold Unit|BENTROK|Tidak$|SLOT TUTUP|LEWAT|Not OK)/.test(t))return 'bad';
  if(/^(Hold|Belum Sampai|Stok|Menunggu Valid|Menunggu Pelunasan|Menunggu Sisa|Cek Jadwal|Pilih Syarat|Isi |Belum Diajukan|Proses)/.test(t))return 'warn';
  if(/^(Menunggu|Belum Dijadwalkan|Dalam )/.test(t))return 'info';
  return '';};
const chip=t=>t?`<span class="chip ${chipCls(t)}">${esc(t)}</span>`:'';
function toast(m){const w=$('#toast');const d=document.createElement('div');d.textContent=m;w.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ================= STATE ================= */
let S, units=[], UM=new Map();
const UI={tab:'home',s:{q:'',loc:''},h:{sales:'',q:''},u:{q:'',sales:'',view:'aktif'},jd:todayISO()};
function freshState(){return {ar:SAMPLE.ar.slice(),dos:SAMPLE.do.slice(),stock:(SAMPLE.stock||[]).slice(),man:JSON.parse(JSON.stringify(SAMPLE.man)),fb:{},set:DEF_SET(),meta:{sample:true,arAt:null,doAt:null,stockAt:null}}}
function emptyState(){return {ar:[],dos:[],stock:[],man:{},fb:{},set:DEF_SET(),meta:{sample:false,arAt:null,doAt:null,stockAt:null}}}
function loadState(){try{const j=localStorage.getItem(LS_KEY);if(j){const o=JSON.parse(j);if(o&&o.ar&&o.set)return o}}catch(e){}return null}
let saveT;function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan browser tidak tersedia. Unduh backup secara berkala.')}},250);if(typeof queueSave==='function')queueSave()}

/* ================= PERHITUNGAN (setara rumus Excel) ================= */
function compute(){
  const set=S.set,T=todayISO();
  const jb=toH(set.jamBuka),jt=toH(set.jamTutup),maxS=+set.maxSlot||4,d0=+set.durZona0||1;
  const zones=[...set.zones].sort((a,b)=>a.min-b.min);
  const maxKm=Math.max(...zones.map(z=>+z.max));
  const lsDP=(set.leasingDP||[]).map(x=>String(x).trim().toLowerCase());
  const arM=new Map(S.ar.map(a=>[a.chassis,a])),doM=new Map(S.dos.map(d=>[d.chassis,d]));
  const stM=new Map((S.stock||[]).map(x=>[x.ch,x])),stLoaded=stM.size>0;
  const branch=(set.branchLoc||[]).map(x=>String(x).trim().toUpperCase());
  const keysDoc=[...new Set([...S.dos.map(d=>d.chassis),...S.ar.map(a=>a.chassis)])];
  const keys=[...keysDoc,...[...stM.keys()].filter(k=>!arM.has(k)&&!doM.has(k))];
  /* tahap 1: data unit + status AR */
  units=keys.map(ch=>{
    const a=arM.get(ch),d=doM.get(ch),s=stM.get(ch),m=S.man[ch]||{};
    const leasing=(a&&a.leasing)||(d&&d.leasing)||'';
    const u={ch,m,inAR:!!a,
      sales:(a&&a.sales)||(d&&d.sales)||'',custNo:(a&&a.custNo)||(d&&d.custNo)||'',cust:(a&&a.cust)||(d&&d.cust)||(s?'(Stok tanpa faktur)':''),
      grp:a?a.grp:'',billing:a?a.billing:(d?d.noFaktur:''),jenis:a?a.kjual:(leasing?'Kredit':'CSH'),leasing,
      funcLoc:a?a.funcLoc:'',amount:a?a.amount:0,posting:a?a.posting:(d?d.tglFaktur:''),due:a?a.due:'',gi:a?a.gi:'',
      stnkAR:a?a.stnk:'',approve:a?a.approve:'',tipe:d?d.tipe:(s?s.material:''),warna:d?d.warna:(s?s.colorDesc:''),model:s?s.matDesc:'',inStock:!!s,lok:s?s.loc:'',lokNama:s?(s.locDesc||s.loc):'',stockAge:(s&&s.age!=='')?s.age:'',noDoc:!a&&!d,outs:a?a.outs:0,aging:a?a.age:null};
    u.stLoaded=stLoaded;u.out=false;u.pos='';
    if(stLoaded){
      const L=String(u.lok||'').toUpperCase();
      if(!u.inStock){u.pos='Sudah Delivery';u.out=true}
      else if(L==='TCUST-T066IN')u.pos='Dalam Pengiriman ke Customer';
      else if(branch.includes(L))u.pos='Di Cabang';
      else if(L==='T066IN')u.pos='Dalam Perjalanan ke Cabang';
      else u.pos='Belum Sampai Cabang';
    }
    u.atBranch=u.pos==='Di Cabang';
    u.kirim=!!u.gi||u.out;
    u.fullDP=m.fullDP||'';
    u.bucket=u.aging==null?'-':u.aging<=0?'Not Due':u.aging<=30?'1-30':u.aging<=60?'31-60':u.aging<=90?'61-90':u.aging<=120?'91-120':u.aging<=150?'121-150':'>150';
    u.od=u.aging!=null&&u.aging>0;
    const cr=String(u.jenis).slice(0,2)==='CR',fp=u.fullDP;
    let st;
    if(!u.inAR)st='Lunas (keluar dari AR)';
    else if(u.outs<=0)st='Lunas';
    else if(fp==='')st='Isi Full DP / Payment';
    else if(fp==='Full Payment')st='Lunas';
    else if(fp!=='Full DP')st=cr?'Menunggu Pelunasan DP':'Menunggu Pelunasan Unit';
    else if(!cr)st='Menunggu Sisa Pembayaran';
    else if(!u.kirim)st='Menunggu Pengiriman Unit';
    else if(!u.approve)st='Kirim Tagihan Segera';
    else if(!m.tglValid)st='Menunggu Valid Leasing';
    else st='Menunggu Pembayaran';
    u.stAR=st;
    u.posisi=u.pos?(u.pos+(u.lokNama?' · '+u.lokNama:'')):(u.funcLoc||'');
    u.fb=(fp||'-')+' / '+(u.posisi||'-')+' / '+(u.kirim?'Unit Sudah Kirim'+(u.gi?' '+fmtD(u.gi):''):'Unit Belum Kirim');
    u.tglSTNKJadi=m.tglSTNKJadi||u.stnkAR||'';
    u.syarat=m.syarat||'';
    u.stStnk=!u.syarat?'Pilih Syarat':u.syarat==='Tanpa STNK'?'Tidak Perlu':u.tglSTNKJadi?'STNK Jadi':!m.tglMohonSTNK?'Belum Diajukan':'Proses STNK';
    u.search=(u.cust+' '+ch+' '+u.sales+' '+u.tipe+' '+u.model+' '+u.warna+' '+u.leasing+' '+u.billing+' '+u.lokNama).toLowerCase();
    return u;
  });
  /* tahap 2: zona & durasi */
  units.forEach(u=>{
    const m=u.m;u.slot=m.slot||'';u.tglPlan=m.tglPlan||'';u.jarak=(m.jarak===undefined||m.jarak==='')?'':+m.jarak;
    if(u.slot===SC){u.zona='Zona 0';u.dur=d0}
    else if(m.zona==='Luar Zona'){u.zona='Luar Zona';u.dur=''}
    else if(m.zona&&zones.some(x=>x.n===m.zona)){const z0=zones.find(x=>x.n===m.zona);u.zona=z0.n;u.dur=+z0.dur}
    else if(u.jarak===''){u.zona='';u.dur=''}
    else if(u.jarak>maxKm){u.zona='Luar Zona';u.dur=''}
    else{let z=zones[0];zones.forEach(x=>{if(u.jarak>=x.min)z=x});u.zona=z.n;u.dur=+z.dur}
  });
  /* tahap 3: jam berangkat/kembali per slot */
  const sd={};
  units.forEach(u=>{if(u.tglPlan&&u.slot&&u.slot!==SC&&u.dur!==''){const k=u.tglPlan+'|'+u.slot;sd[k]=Math.max(sd[k]||0,u.dur)}});
  units.forEach(u=>{
    u.jamB='';u.jamK='';
    if(!u.tglPlan||!u.slot)return;
    if(u.slot===SC){const j=toH(u.m.jamSerah);if(j!==''){u.jamB=j;u.jamK=j+d0}return}
    const n=SLOTS.indexOf(u.slot);let before=0;
    for(let i=0;i<n;i++)before+=sd[u.tglPlan+'|'+SLOTS[i]]||0;
    u.jamB=jb+before;u.jamK=u.jamB+(sd[u.tglPlan+'|'+u.slot]||0);
  });
  /* tahap 4: cek jadwal */
  const onDate=(d,sl)=>units.filter(x=>x.tglPlan===d&&x.slot===sl);
  const freeSlots=d=>SLOTS.slice(0,maxS).filter(s=>onDate(d,s).length===0);
  units.forEach(u=>{
    const rd=u.m.reschedule||'';
    let base='';
    if(u.tglPlan&&u.slot){
      if(u.slot===SC){
        if(u.jamB==='')base='Isi jam serah terima';
        else if(u.jamK>jt)base='Lewat jam tutup';
        else{base='OK - Serah Terima Cabang';
          if(units.some(x=>x.tglPlan===u.tglPlan&&x.slot&&x.slot!==SC&&x.jamB!==''&&x.jamB<u.jamK&&x.jamK>u.jamB))base+=' (bersamaan dgn pengiriman luar)';}
      }else{
        const n=SLOTS.indexOf(u.slot)+1;
        if(u.zona==='')base='Isi zona';
        else if(u.zona==='Luar Zona')base='Luar Zona - cek manual';
        else if(units.some(x=>x.tglPlan===u.tglPlan&&x.slot===u.slot&&x.cust!==u.cust))base='BENTROK: slot dipakai customer lain';
        else if(n>1&&n<=maxS&&onDate(u.tglPlan,SLOTS[n-2]).length===0)base='Isi slot sebelumnya dulu';
        else if(u.slot==='Cadangan')base=u.jamK>jt?'OK - Urgent (lewat jam tutup)':'OK - Urgent';
        else base=u.jamK>jt?'SLOT TUTUP: lewat jam tutup':'OK';
      }
    }
    if(rd&&rd!==u.tglPlan){
      if(rd<T)base='RESCHEDULE: tgl '+fmtD(rd)+' sudah lewat';
      else{const f=freeSlots(rd);base='RESCHEDULE ke '+fmtD(rd)+(u.m.rsSlot?' ('+u.m.rsSlot+')':'')+': '+(f.length===0?'PENUH – pakai Cadangan / Serah Terima Cabang / pilih tgl lain':f.length+' slot tersedia ('+f.join(', ')+') – ubah Tgl Plan & Slot')}
    }
    u.cek=base;
  });
  /* tahap 5: status delivery */
  units.forEach(u=>{
    const m=u.m,cr=String(u.jenis).slice(0,2)==='CR';
    const jalurDP=cr&&lsDP.includes(String(u.leasing).trim().toLowerCase());
    const fp=u.fullDP;
    const lunasPay=u.outs<=0||fp==='Full Payment'||u.stAR.slice(0,5)==='Lunas';
    const lunasDP=lunasPay||fp==='Full DP';
    const stnkOK=u.syarat==='Tanpa STNK'||!!u.tglSTNKJadi;
    const qcOK=m.hasilQC==='OK',cabangOK=u.atBranch||!!m.tglDR,cuciOK=!!m.cuci;
    let hold='';
    if(jalurDP){
      if(!lunasDP)hold='Hold AR - DP Belum Lunas';
      else if(!u.syarat)hold='Hold STNK - Pilih Syarat STNK';
      else if(!stnkOK)hold='Hold STNK - Tunggu STNK Jadi';
      else if(!qcOK)hold='Hold QC - Belum QC';
    }else{
      if(!lunasPay)hold='Hold AR - Belum Lunas Payment';
      else if(!u.syarat)hold='Hold STNK - Pilih Syarat STNK';
      else if(!stnkOK)hold='Hold STNK - Tunggu STNK Jadi';
      else if(!cabangOK)hold='Hold Unit - Belum Sampai Cabang';
      else if(!qcOK)hold='Hold QC - Belum QC';
      else if(!cuciOK)hold='Hold Cuci - Belum Cuci';
    }
    u.done=!!m.bstkKembali||u.out;
    u.stDel=u.done?'Sudah Delivery':hold?hold:!u.tglPlan?'Belum Dijadwalkan':(u.cek.slice(0,2)==='OK'?'Terjadwal':'Cek Jadwal');
    u.hold=!u.done&&!!hold;
    u.boleh=u.hold?'Tidak':'Ya';
    u.kat=u.done?'Sudah Delivery':u.hold?u.stDel.split(' - ')[0]:u.stDel;
    if(u.noDoc&&!m.bstkKembali){u.done=false;u.hold=false;u.boleh='-';u.stDel='Stok tanpa faktur';u.kat='Stok'}
  });
  UM=new Map(units.map(u=>[u.ch,u]));
}

const SYNC_URL='';
const SYNC={url:'',code:'',ver:0,av:0,on:false,pending:false,status:'',dp:false};
(function(){try{
  const q=new URLSearchParams(location.search).get('s');
  if(q){localStorage.setItem('unittrack.sync',JSON.stringify({url:q,code:''}));try{history.replaceState(null,'',location.pathname)}catch(e){}}
  const j=JSON.parse(localStorage.getItem('unittrack.sync')||'null');if(j&&j.url){SYNC.url=j.url;SYNC.code=j.code||''}
}catch(e){}
if(!SYNC.url&&SYNC_URL)SYNC.url=SYNC_URL;})();
function todayHTML(){const t=todayISO();return `${dayName(t)}, ${fmtD(t)}<br><span style="opacity:.7">${S.meta.arAt?'AR '+S.meta.arAt:'AR: data contoh'}${S.meta.stockAt?' · Stock '+S.meta.stockAt:''}${SYNC.on&&SYNC.status?' · '+SYNC.status:''}</span>`}
function badge(t){SYNC.status=t;const el=$('#today');if(el)el.innerHTML=todayHTML()}
async function api(body,get){
  const payload=Object.assign({code:SYNC.code},body);
  if(get){const q=new URLSearchParams();for(const k in payload)if(payload[k]!==undefined)q.set(k,String(payload[k]));
    const r=await fetch(SYNC.url+(SYNC.url.includes('?')?'&':'?')+q.toString());return r.json()}
  const r=await fetch(SYNC.url,{method:'POST',body:JSON.stringify(payload)});return r.json();
}
async function pullState(){
  const r=await api({action:'get'},true);
  if(r.err==='need_code'){askCode();return false}
  if(!r.ok)throw new Error(r.err||'gagal');
  SYNC.ver=r.version||0;SYNC.av=r.adminVer||0;SYNC.dp=!!r.defaultPins;
  if(r.state){const pins=S.set&&S.set.pins;S=r.state;fixState();if(pins)S.set.pins=pins;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}compute();renderNav();PG[UI.tab].render()}
  badge('Online ✓');return true;
}
let saveTimer;
function queueSave(){if(!SYNC.on||ROLE!=='admin')return;SYNC.pending=true;clearTimeout(saveTimer);saveTimer=setTimeout(doSave,1200);badge('Menyimpan…')}
async function doSave(){
  if(!SYNC.on||!SYNC.pending)return;SYNC.pending=false;badge('Menyimpan…');
  const st=JSON.parse(JSON.stringify(S));if(st.set)delete st.set.pins;
  try{
    const r=await api({action:'save',role:'admin',pin:PIN,baseAdmin:SYNC.av,state:st,mirror:buildMirror()});
    if(r.ok){SYNC.ver=r.version;SYNC.av=r.adminVer;badge('Tersimpan online ✓');if(r.merged)await pullState()}
    else if(r.err==='conflict'){toast('Data diubah admin lain. Memuat data terbaru…');await pullState()}
    else if(r.err==='pin'||r.err==='terkunci'){toast(r.err==='pin'?'PIN admin tidak valid. Masuk ulang.':'Terlalu banyak percobaan. Tunggu 10 menit.');badge('Gagal menyimpan')}
    else{toast('Gagal menyimpan online: '+r.err);SYNC.pending=true;badge('Gagal menyimpan')}
  }catch(e){SYNC.pending=true;badge('Offline, belum tersimpan')}
}
function buildMirror(){
  const list=units.filter(u=>!u.noDoc&&(u.inAR||!u.done)).sort((a,b)=>(a.sales||'').localeCompare(b.sales||'')||(a.done-b.done)||a.cust.localeCompare(b.cust));
  const rows=dashObjs(list);if(!rows.length)return null;
  const header=Object.keys(rows[0]);
  const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  return {header,rows:rows.map(o=>header.map(k=>{const v=o[k];return v instanceof Date?iso(v):(v==null?'':v)}))};
}
let pollT,pollInit=false;
function startPoll(){clearInterval(pollT);pollT=setInterval(pollOnce,30000);if(!pollInit){pollInit=true;document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollOnce()})}}
async function pollOnce(){
  if(!SYNC.on||document.hidden||!$('#modal').hidden)return;
  try{
    if(SYNC.pending){await doSave();return}
    const busy=UI.tab==='admin'&&['pasteAR','pasteDO','pasteStock'].some(id=>{const e=$('#'+id);return e&&e.value.trim()});
    const r=await api({action:'ping'},true);
    if(r.err==='need_code'){askCode();return}
    if(r.ok){SYNC.dp=!!r.defaultPins;if(r.version!==SYNC.ver&&!busy)await pullState();else badge('Online ✓')}
  }catch(e){badge('Offline')}
}
function askCode(){
  const M=$('#modal');M.innerHTML=`<div class="sheet" style="width:min(380px,100%)"><div class="sheet-h"><h2 style="margin:0">Kode akses</h2></div><div class="sheet-b"><label class="fld"><span>Masukkan kode akses untuk melihat data</span><input type="password" id="kc" autocomplete="off"></label></div><div class="sheet-f"><button class="btn" id="kgo">Lanjut</button></div></div>`;M.hidden=false;
  $('#kgo').onclick=()=>{SYNC.code=$('#kc').value;try{const j=JSON.parse(localStorage.getItem('unittrack.sync')||'{}');j.url=SYNC.url;j.code=SYNC.code;localStorage.setItem('unittrack.sync',JSON.stringify(j))}catch(e){}closeModal();pullState().then(()=>startPoll()).catch(()=>badge('Offline'))};
}
async function syncConnect(){
  const u=(($('#syurl')||{}).value||'').trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec/.test(u))return toast('Link tidak valid. Harus berawalan https://script.google.com/macros/s/ dan berakhiran /exec');
  const old=SYNC.url;SYNC.url=u;
  try{
    const r=await api({action:'ping'},true);
    if(r.err==='need_code'){askCode();return}
    if(!r.ok)throw new Error(r.err||'gagal');
    try{localStorage.setItem('unittrack.sync',JSON.stringify({url:u,code:SYNC.code}))}catch(e){}
    SYNC.on=true;SYNC.ver=r.version||0;SYNC.av=r.adminVer||0;SYNC.dp=!!r.defaultPins;
    setRole('view');
    if(r.version)await pullState();
    afterRole();startPoll();badge('Online ✓');
    toast(r.version?'Terhubung. Data online dimuat. Masuk ulang dengan PIN dari skrip.':'Terhubung. Sheet masih kosong. Masuk ulang dengan PIN dari skrip, lalu kirim data.');
  }catch(e){SYNC.url=old;toast('Tidak bisa terhubung. Pastikan Web App di-deploy dengan akses “Siapa saja”.')}
}
async function syncPush(){
  if(!SYNC.on)return;
  if(!confirm('Data di Google Sheet akan diganti dengan data di perangkat ini. Lanjutkan?'))return;
  try{const p=await api({action:'ping'},true);SYNC.av=p.adminVer||0;SYNC.pending=true;await doSave()}catch(e){toast('Tidak bisa terhubung ke server')}
}
async function syncPull(){
  if(!SYNC.on)return;
  if(!confirm('Data di perangkat ini akan diganti dengan data dari Google Sheet. Lanjutkan?'))return;
  try{await pullState();toast('Data dari Sheet dimuat')}catch(e){toast('Tidak bisa terhubung ke server')}
}

function syncOff(){

}

function slotOptions(u,date,durIn){
  const set=S.set,jb=toH(set.jamBuka),jt=toH(set.jamTutup),maxS=+set.maxSlot||4;
  const zones=[...set.zones].sort((a,b)=>a.dur-b.dur),minDur=zones[0].dur;
  const myDur=+durIn||((u.dur!==''&&u.dur!=null)?+u.dur:minDur);
  const occ=[];
  units.forEach(x=>{
    if(x.ch===u.ch||x.done||x.noDoc)return;
    if(x.tglPlan===date&&x.slot&&x.slot!==SC)occ.push({slot:x.slot,cust:x.cust,dur:(x.dur!==''&&x.dur!=null)?+x.dur:minDur});
  });
  const out=[];let start=jb,prevHas=true;
  for(let i=0;i<maxS;i++){
    const sl=SLOTS[i],here=occ.filter(o=>o.slot===sl);
    const sd=here.length?Math.max(...here.map(o=>o.dur)):0;
    const same=here.length>0&&here.every(o=>o.cust===u.cust);
    const jamB=start,jamK=start+Math.max(sd,myDur);
    let state='ok',info='Tersedia';
    if(here.length&&!same){out.push({slot:sl,state:'terisi',info:'Penuh. Cek jadwal, pilih slot lain',jamB,jamK:start+sd});start+=sd;prevHas=true;continue}
    if(!here.length&&!prevHas){state='urut';info='Isi slot sebelumnya dulu'}
    else if(jamK>jt){state='tutup';info='Lewat jam tutup. Pilih slot lain'}
    else if(same){info='Tersedia (digabung, customer sama)'}
    out.push({slot:sl,state,info,jamB,jamK});
    start+=sd;prevHas=here.length>0;
  }
  out.push({slot:'Cadangan',state:'urgent',info:'Khusus urgent, hubungi admin',jamB:'',jamK:''});
  return out;
}

  }
  const m=Object.assign({},S.man[ch]);
  if(mode==='reschedule'){m.rsDari=(m.tglPlan||'')+' | '+(m.slot||'');m.konfirmasi='Rescheduled';m.reschedule=date}
  else{delete m.konfirmasi;delete m.reschedule;delete m.rsDari}
  m.tglPlan=date;m.slot=slot;m.zona=zona;delete m.jamSerah;delete m.rsSlot;m.konfAt=Date.now();S.man[ch]=m;
  persist();closeModal();refresh();toast(msg);
}

function konfChip(u){
  const m=u.m;
  if(m.konfirmasi==='On Scheduled')return cp('On Schedule','ok');
  if(m.konfirmasi==='Rescheduled')return cp('Reschedule','warn')+(m.rsDari?` <span class="sub">dari ${esc(rsDariTxt(m.rsDari))}</span>`:'');
  return cp('Belum ada konfirmasi sales','warn');
}
PG.jd={render(){
  const d=UI.jd,set=S.set,jb=toH(set.jamBuka),jt=toH(set.jamTutup),zones=[...set.zones].sort((a,b)=>a.dur-b.dur);
  let prevEnd=jb,tot=0,bentrok=0;
  const rows=SLOTS.slice(0,5).map(sl=>{
    const us=units.filter(u=>u.tglPlan===d&&u.slot===sl);
    const dur=us.length?Math.max(0,...us.map(u=>+u.dur||0)):0;
    const H=prevEnd,I=H+dur,sisa=Math.max(0,jt-H);prevEnd=I;
    const custs=[...new Set(us.map(u=>u.cust))];const bt=custs.length>1;if(bt)bentrok++;tot+=us.length;
    let st;
    if(us.length)st=bt?'BENTROK':sl==='Cadangan'?'TERISI (URGENT)':I>jt?'LEWAT JAM TUTUP':'TERISI';
    else st=sl==='Cadangan'?'CADANGAN (urgent)':sisa<Math.min(...zones.map(z=>z.dur))?'TUTUP':'KOSONG';
    const cls=/BENTROK|LEWAT|TUTUP/.test(st)?'bad':/TERISI/.test(st)?'info':/CADANGAN/.test(st)?'warn':'ok';
    const muat=us.length?'':(()=>{let n='-';zones.forEach(z=>{if(z.dur<=sisa+1e-9)n=z.n});return n})();
    return `<tr><td><b>${sl}</b></td><td><span class="chip ${cls}">${st}</span></td><td>${us.length?us.map(u=>`<div class="ln"><a class="lnk" data-act="open" data-ch="${esc(u.ch)}">${esc(u.cust)}</a></div>`).join(''):'<span class="muted">-</span>'}</td><td class="mono">${us.length?hh(H)+' – '+hh(I):''}</td><td>${us.length?esc((zones.find(z=>z.dur===dur)||{}).n||''):(muat!=='-'?'<span class="muted">muat s/d '+muat+'</span>':'')}</td><td>${us.length?us.map(u=>`<div class="ln">${konfChip(u)}</div>`).join(''):'<span class="muted">-</span>'}</td></tr>`;
  }).join('');
  const st=units.filter(u=>u.tglPlan===d&&u.slot===SC);tot+=st.length;
  
  $('#main').innerHTML=`${banner()}
  <div class="bar"><div><h2>Jadwal Kirim</h2><div class="muted">Jam ${set.jamBuka}–${set.jamTutup}. Satu driver, ${set.maxSlot} slot per hari + 1 cadangan.</div></div></div>
  <div class="bar">
    <button class="btn ghost sm" data-act="day" data-n="-1">◀</button>
    <input type="date" value="${d}" data-f="jd" style="font-weight:700">
    <button class="btn ghost sm" data-act="day" data-n="1">▶</button>
    <button class="btn ghost sm" data-act="day" data-n="0">Hari ini</button>
    <b>${dayName(d)}, ${fmtD(d)}</b><span class="sp"></span>
    <span class="chip info">${tot} unit</span>${bentrok?`<span class="chip bad">${bentrok} slot bentrok</span>`:''}
  </div>
  <div class="tw" style="max-height:none"><table><thead><tr><th>Slot</th><th>Status</th><th>Customer</th><th>Jam</th><th>Zona</th><th>Konfirmasi sales</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h3>Serah terima di cabang</h3>${st.length?st.map(u=>`<div class="todo" data-act="open" data-ch="${esc(u.ch)}"><span><b>${esc(u.cust)}</b><div class="sub">${esc(unitName(u))}</div></span><span style="display:flex;gap:10px;align-items:center">${konfChip(u)}<span class="mono">${hh(u.jamB)||'isi jam'}</span></span></div>`).join(''):'<div class="muted">Tidak ada.</div>'}</div>

  </div>`;
},fill(){}};

const AR_COLS={sales:['salesman name'],custNo:['customer'],cust:['customer name'],grp:['grp.desc.'],chassis:['chassis no.','chassis no'],funcLoc:['func.loc'],gi:['gi date'],stnk:['stnk date'],billing:['billing no'],kjual:['kjual'],leasing:['leasing name'],approve:['approve date adh e-invoice'],age:['age'],posting:['posting dt'],due:['due date'],amount:['billing amount'],outs:['outstd. balance']};
const DO_COLS={noFaktur:['no. faktur'],tglFaktur:['tgl.faktur'],sales:['salesman name'],spv:['spv name'],custNo:['cust. no'],cust:['nama customer'],tipe:['tipe kendaraan'],chassis:['chasis','chassis'],warna:['color description'],leasing:['leasing']};
const AR_POS=['sales','custNo','cust','grp','chassis','funcLoc','gi','stnk','billing','kjual','leasing','approve','age','posting','due','amount','outs'];
const DO_POS={noFaktur:2,tglFaktur:3,sales:6,spv:7,custNo:8,cust:9,tipe:10,chassis:11,warna:13,leasing:15};
function pDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date){if(isNaN(v))return '';const d=new Date(v.getTime()+43200000);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000)+43200000);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}return ''}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/)))return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  return '';
}
function pNum(v){
  if(typeof v==='number')return v;if(v==null)return 0;
  let s=String(v).trim().replace(/\s/g,'').replace(/^Rp/i,'');if(s==='')return 0;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  if(/-$/.test(s))s='-'+s.slice(0,-1);
  const n=Number(s);return isNaN(n)?0:n;
}
const isCh=v=>/^[A-Z0-9]{15,18}$/.test(String(v||'').trim().toUpperCase());
function detect(rows){
  for(let i=0;i<Math.min(4,rows.length);i++){
    const h=(rows[i]||[]).map(c=>String(c==null?'':c).trim().toLowerCase());
    if(h.includes('equipment')&&h.includes('functional location'))return {type:'stock',hi:i,h};
    if(h.includes('chassis no.')||h.includes('chassis no'))return {type:'ar',hi:i,h};
    if(h.includes('chasis'))return {type:'do',hi:i,h};
  }
  const r=rows[0]||[];
  if(isCh(r[4])&&!isCh(r[11]))return {type:'ar',hi:-1};
  if(isCh(r[11]))return {type:'do',hi:-1};
  return null;
}
function ingest(rows,force){
  const det=detect(rows);if(!det)return {err:'Judul kolom tidak dikenali. Pastikan baris judul ikut ter-copy.'};
  if(force&&det.type!==force)return {err:'Data yang di-paste terlihat seperti report '+det.type.toUpperCase()+', bukan '+force.toUpperCase()+'.'};
  const out=[];const data=rows.slice(det.hi+1);
  if(det.type==='stock'){
    const SK={ch:['equipment'],plant:['plant'],material:['material'],matDesc:['material description'],color:['color'],colorDesc:['color description'],engine:['engine'],loc:['functional location'],locDesc:['functlocdescrip.'],age:['age'],rrn:['rrn number']};
    const idx={};for(const k in SK)idx[k]=det.h.findIndex(x=>SK[k].includes(x));
    data.forEach(r=>{const g=k=>idx[k]>=0?r[idx[k]]:'';const ch=String(g('ch')||'').trim().toUpperCase();if(!isCh(ch))return;
      const ag=g('age');out.push({ch,plant:String(g('plant')||'').trim(),material:String(g('material')||'').trim(),matDesc:String(g('matDesc')||'').trim(),color:String(g('color')||'').trim(),colorDesc:String(g('colorDesc')||'').trim(),engine:String(g('engine')||'').trim(),loc:String(g('loc')||'').trim(),locDesc:String(g('locDesc')||'').trim(),age:(ag===''||ag==null)?'':pNum(ag),rrn:String(g('rrn')||'').trim()})});
    return {type:'stock',items:out};
  }
  if(det.type==='ar'){
    let idx={};
    if(det.hi>=0){for(const k in AR_COLS){idx[k]=det.h.findIndex(x=>AR_COLS[k].includes(x))}}
    else AR_POS.forEach((k,i)=>idx[k]=i);
    data.forEach(r=>{const g=k=>idx[k]>=0?r[idx[k]]:'';const ch=String(g('chassis')||'').trim();if(!isCh(ch))return;
      out.push({sales:String(g('sales')||'').trim(),custNo:String(g('custNo')||'').trim(),cust:String(g('cust')||'').trim(),grp:String(g('grp')||'').trim(),chassis:ch,funcLoc:String(g('funcLoc')||'').trim(),gi:pDate(g('gi')),stnk:pDate(g('stnk')),billing:String(g('billing')||'').trim(),kjual:String(g('kjual')||'').trim(),leasing:String(g('leasing')||'').trim(),approve:pDate(g('approve')),age:pNum(g('age')),posting:pDate(g('posting')),due:pDate(g('due')),amount:pNum(g('amount')),outs:pNum(g('outs'))})});
  }else{
    let idx={};
    if(det.hi>=0){for(const k in DO_COLS){idx[k]=det.h.findIndex(x=>DO_COLS[k].includes(x))}}
    else idx=Object.assign({},DO_POS);
    data.forEach(r=>{const g=k=>idx[k]>=0?r[idx[k]]:'';const ch=String(g('chassis')||'').trim();if(!isCh(ch))return;
      out.push({noFaktur:String(g('noFaktur')||'').trim(),tglFaktur:pDate(g('tglFaktur')),sales:String(g('sales')||'').trim(),spv:String(g('spv')||'').trim(),custNo:String(g('custNo')||'').trim(),cust:String(g('cust')||'').trim(),tipe:String(g('tipe')||'').trim(),chassis:ch,warna:String(g('warna')||'').trim(),leasing:String(g('leasing')||'').trim()})});
  }
  return {type:det.type,items:out};
}
function nowStr(){const d=new Date();return fmtD(todayISO())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function applyIngest(res){
  if(res.err){toast(res.err);return false}
  if(!res.items.length){toast('Tidak ada baris unit yang terbaca.');return false}
  if(res.type==='stock'){S.stock=res.items;S.meta.stockAt=nowStr()}
  else if(res.type==='ar'){S.ar=res.items;S.meta.arAt=nowStr()}
  else{const mp=new Map(S.dos.map(d=>[d.chassis,d]));res.items.forEach(d=>mp.set(d.chassis,d));S.dos=[...mp.values()];S.meta.doAt=nowStr()}
  S.meta.sample=false;persist();refresh();
  toast(({ar:'Data AR diganti: ',do:'Data DO ditambahkan: ',stock:'Data All Stock diganti: '})[res.type]+res.items.length+' unit');return true;
}
function parseTSV(t){return t.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='').map(l=>l.split('\t'))}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(file)})}
async function handleFiles(files){
  if(typeof XLSX==='undefined'){toast('Pustaka Excel belum termuat. Coba muat ulang halaman.');return}
  let n=0;
  for(const f of files){
    try{
      const buf=await readFile(f);const wb=XLSX.read(buf,{type:'array',cellDates:true});
      for(const name of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
        const det=detect(rows.slice(0,6));if(!det||det.hi<0)continue;
        if(applyIngest(ingest(rows)))n++;
      }
    }catch(e){toast('Gagal membaca '+f.name)}
  }
  if(!n)toast('Tidak ada sheet AR / DO yang dikenali di file tersebut.');
}

const toD=iso=>{if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return iso||'';const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};

  const dv=units.map((u,i)=>({'No':i+1,'No Rangka':u.ch,'Nama Sales':u.sales,'Nama Customer':u.cust,'Jenis Bayar':u.jenis,'Leasing':u.leasing,'Outstanding (Rp)':u.outs,'Status AR':u.stAR,'Posisi Unit':u.posisi,'Umur Stock (hari)':u.stockAge,'Tgl DR Unit':toD(u.m.tglDR),'Plan Unit Sampai Cabang':toD(u.m.planSampai),'Tgl QC':toD(u.m.tglQC),'DEC In':u.m.decIn?'Ya':'','DEC Out':u.m.decOut?'Ya':'','Cuci':u.m.cuci?'Sudah':'Belum','Hasil QC':u.m.hasilQC||'','Boleh Kirim?':u.boleh,'Keterangan (defect)':u.m.ketDefect||'','Syarat STNK':u.syarat,'Tgl Mohon STNK/KIR':toD(u.m.tglMohonSTNK),'Tgl STNK Jadi':toD(u.tglSTNKJadi),'Status STNK':u.stStnk,'Tgl Plan Delivery':toD(u.tglPlan),'Slot':u.slot,'Jarak (km)':u.jarak,'Zona':u.zona,'Durasi (jam)':u.dur,'Jam Berangkat':hh(u.jamB),'Jam Kembali':hh(u.jamK),'Alamat Kirim':u.m.alamat||'','Konfirmasi':u.m.konfirmasi||'','Tgl Reschedule':toD(u.m.reschedule),'Cek Jadwal':u.cek,'Tgl BSTK Cetak':toD(u.m.bstkCetak),'Tgl BSTK Kembali / GI':toD(u.m.bstkKembali),'Status Delivery':u.stDel,'Keterangan':u.m.ketDelivery||''}));
  const jd=units.filter(u=>u.tglPlan&&!u.done).sort((a,b)=>a.tglPlan.localeCompare(b.tglPlan)||SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot)).map(u=>({'Tanggal':toD(u.tglPlan),'Slot':u.slot,'Customer':u.cust,'No Rangka':u.ch,'Zona':u.zona,'Jam Berangkat':hh(u.jamB),'Jam Kembali':hh(u.jamK),'Alamat':u.m.alamat||'','Status Delivery':u.stDel,'Cek Jadwal':u.cek}));
  const add=(rows,name)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}],{cellDates:true,dateNF:'dd-mmm-yy'}),name);
  add(ar,'Monitoring AR');add(dv,'Delivery Unit');add(jd,'Jadwal Delivery');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx',cellDates:true});
  try{await dl.save({filename:'Monitoring_Unit_BSDC_'+todayISO()+'.xlsx',data:buf});toast('File Excel siap')}catch(e){if(e&&e.code!=='declined')toast('Gagal mengunduh')}
}

function setPath(path,val){const [a,b]=path.split('.');if(b)UI[a][b]=val;else UI[a]=val}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target===$('#modal')&&!MUSTCHG)closeModal();return}
  const a=t.dataset.act;
  if(a==='tab')go(t.dataset.tab);
  else if(a==='login')openLogin();
  else if(a==='logout'){setRole('view');UI.h.sales='';UI.u.sales='';closeModal();afterRole();toast('Keluar. Mode lihat saja')}
  else if(a==='unitview'){UI.u.view=t.dataset.v;UI.u.q='';UI.u.sales='';go('unit')}
  else if(a==='noop'){}
  else if(a==='chpin')openChangePin(false)
  else if(a==='konfq'){setKonf(t.dataset.ch,'On Scheduled')}
  else if(a==='rsopen'){const w=t.closest('.kc');if(w)rsOpen(w,t.dataset.ch,t.dataset.mode||'reschedule')}
  else if(a==='rszone'){const w=t.closest('.kc');if(!w)return;w.dataset.zona=t.dataset.zona;w.querySelectorAll('.zb').forEach(b=>b.classList.toggle('sel',b===t));rsSlots(w)}
  else if(a==='rspick'){const w=t.closest('.kc');if(!w)return;w.dataset.slot=t.dataset.slot;w.querySelectorAll('.slotb.ok').forEach(b=>b.classList.toggle('sel',b===t));const ok=w.querySelector('[data-act="rsok"]');if(ok)ok.disabled=false}
  else if(a==='rsok'){const w=t.closest('.kc');const d=w?w.querySelector('.rsd').value:'',sl=w?w.dataset.slot:'',z=w?w.dataset.zona:'';if(!d)return toast('Pilih tanggal dulu');if(d<todayISO())return toast('Tanggal tidak boleh sudah lewat');if(!z)return toast('Pilih zona dulu');if(!sl)return toast('Pilih slot yang tersedia dulu');setJadwal(t.dataset.ch,w.dataset.mode,d,z,sl)}
  else if(a==='rscancel'){if(t.closest('#modal'))openUnit(t.dataset.ch);else PG.home.fill()}
  else if(a==='konfr'){const w=$('#rsw');if(w)w.hidden=false}
  else if(a==='konf'){setKonf(t.dataset.ch,'On Scheduled','')}
  else if(a==='konfsave'){const d=$('#rsd').value;if(!d)return toast('Pilih tanggal usulan dulu');if(d<todayISO())return toast('Tanggal tidak boleh sudah lewat');setKonf(t.dataset.ch,'Rescheduled',d)}
  else if(a==='hsales'){UI.h.sales=t.dataset.s==='(tanpa sales)'?'':t.dataset.s;PG.home.render()}
  else if(a==='dashx')dashExport();
  else if(a==='fsx')fsExport();
  else if(a==='sloc'){UI.s.loc=t.dataset.v;PG.stok.render()}
  else if(a==='pill'){UI.u.view=t.dataset.v;PG.unit.render()}
  else if(a==='open')openUnit(t.dataset.ch);
  else if(a==='close')closeModal();
  else if(a==='jadwal'){UI.jd=t.dataset.date;go('jd')}
  else if(a==='day'){const n=+t.dataset.n;UI.jd=n===0?todayISO():addDays(UI.jd,n);PG.jd.render()}
  else if(a==='plan'){if(can('admin'))openUnit(t.dataset.ch,{tglPlan:UI.jd})}
  else if(!can('admin'))return;
  else if(a==='clrplan'){const ch=t.dataset.ch;if(!confirm('Hapus jadwal unit ini? Sales perlu memilih jadwal lagi.'))return;const m=Object.assign({},S.man[ch]);['tglPlan','slot','zona','jarak','jamSerah','konfirmasi','reschedule','rsSlot','rsDari'].forEach(k=>delete m[k]);m.konfAt=Date.now();S.man[ch]=m;persist();closeModal();refresh();toast('Jadwal dihapus')}
  else if(a==='applyrs'){const f=$('#uf');if(!f)return;const set=(n,v)=>{const el=f.querySelector('[name='+n+']');if(el)el.value=v};set('tglPlan',t.dataset.d);set('slot',t.dataset.s);set('konfirmasi','On Scheduled');set('reschedule','');set('rsSlot','');toast('Usulan diterapkan ke form. Klik Simpan.')}
  else if(a==='synccon')syncConnect();
  else if(a==='syncpush')syncPush();
  else if(a==='syncpull')syncPull();
  else if(a==='synclink')syncLink();
  else if(a==='syncoff')syncOff();
  else if(a==='pasteAR'){const v=$('#pasteAR').value;if(!v.trim())return toast('Kotak masih kosong');if(S.ar.length&&!confirm('Data AR lama akan diganti total. Lanjutkan?'))return;applyIngest(ingest(parseTSV(v),'ar'))}
  else if(a==='pasteDO'){const v=$('#pasteDO').value;if(!v.trim())return toast('Kotak masih kosong');applyIngest(ingest(parseTSV(v),'do'))}

document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset||{};
  if(t.classList&&t.classList.contains('rsd')){rsDate(t);return}
  if(d.f==='u.sales'){UI.u.sales=t.value;PG.unit.fill()}
